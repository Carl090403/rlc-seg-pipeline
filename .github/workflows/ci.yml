name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { cc: [gcc, clang] }
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.cc }} test
      - run: make CC=${{ matrix.cc }} clean asan
      - run: make CC=${{ matrix.cc }} clean tsan
      - run: make CC=${{ matrix.cc }} bench
